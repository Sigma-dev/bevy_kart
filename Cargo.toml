[package]
name = "bevy_kart"
version = "0.1.0"
edition = "2024"

[dependencies]
# Networking stack
bevy_ticked = { path = "../bevy_ticked" }
bevy_ticked_networking = { path = "../bevy_ticked/crates/bevy_ticked_networking" }
bevy_ticked_networking_ensemble = { path = "../bevy_ticked/crates/bevy_ticked_networking_ensemble" }
bevy_ensemble = { path = "../bevy_ensemble" }
bevy_ensemble_webrtc = { path = "../bevy_ensemble/crates/bevy_ensemble_webrtc" }
postcard = { version = "1", features = ["alloc"] }

audio_manager = { path = "audio_manager" }
bevy_timer = { path = "bevy_timer" }
bevy_bundled_observers = { git = "https://github.com/fallible-algebra/bevy_observers.git" }
bevy_ui_text_input = { git = "https://github.com/Sigma-dev/bevy_ui_text_input.git" }
bevy = { version = "0.18", features = ["wav"] }
avian2d = { version = "0.6", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
# For compact codes: deflate compression + base62 encoding
miniz_oxide = "0.7"
base-x = "0.2"
serde_json = "1"
rand = "0.9.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "Crypto"
] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
