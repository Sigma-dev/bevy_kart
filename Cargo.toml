[package]
name = "bevy_kart"
version = "0.1.0"
edition = "2024"

[features]
# Dev-only network debug overlay + condition simulator. Off by default so it is
# never in a shipped build. Run with: cargo run --features netdebug
netdebug = ["bevy_ensemble/netdebug"]

[dependencies]
# Networking stack
bevy_ticked = { git = "https://github.com/Sigma-studios/bevy_ticked", branch = "main" }
bevy_ticked_networking = { git = "https://github.com/Sigma-studios/bevy_ticked", branch = "main" }
bevy_ticked_networking_ensemble = { git = "https://github.com/Sigma-studios/bevy_ticked", branch = "main" }
bevy_ensemble = { git = "https://github.com/Sigma-studios/bevy_ensemble", branch = "master" }
bevy_ensemble_webrtc = { git = "https://github.com/Sigma-studios/bevy_ensemble", branch = "master" }
postcard = { version = "1", features = ["alloc"] }

audio_manager = { path = "audio_manager" }
bevy_timer = { path = "bevy_timer" }
# `serialize` is what gives `IVec2`/`Vec2`/`Rect` their serde impls, which the map
# format needs. It arrives transitively through avian2d's own `serialize` feature
# today; naming it here means the map format does not quietly depend on a physics
# crate's feature choice.
bevy = { version = "0.19", features = ["wav", "serialize"] }
avian2d = { version = "0.7", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
# For compact codes: deflate compression + base62 encoding
miniz_oxide = "0.7"
base-x = "0.2"
serde_json = "1"
rand = "0.9.2"

[dev-dependencies]
# The server half of the transport, so `examples/signalling_server.rs` can run a real one for
# `scripts/local-session.sh`. The example reaches `axum` through that crate's re-export rather
# than a dependency of its own, so `handle_socket` and the example agree on one `WebSocket`.
bevy_ensemble_webrtc = { git = "https://github.com/Sigma-studios/bevy_ensemble", branch = "master", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "Crypto",
    # Saved maps.
    "Storage",
    # Exporting one as a file: a Blob behind an object URL, clicked through an
    # anchor that is never added to the page.
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    # Importing one: a file input, also never added to the page. `File` derefs to
    # `Blob`, whose `text()` gives a promise -- so no `FileReader` is needed.
    "File",
    "FileList",
    "HtmlInputElement",
    "Event",
    # web-sys gates each step of a type's Deref chain behind its own feature, so
    # reaching `HtmlAnchorElement` from `Document::create_element` needs these.
    "Element",
    "Node",
    "EventTarget",
    "HtmlElement",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
